<!doctype html>
<html lang="ru">
<head>

<body>
<div class="ws">
  <div class="ws-top"><b>Ролик</b>
    <div class="ws-tools">
      <span>Помнит этот браузер</span>
      <button data-toast="Код: вставить ответ ИИ или поставить исправленную сцену">Код</button>
      <button data-toast="Правки: двигать и править текст прямо в кадре">Правки</button>
      <button data-toast="Для ИИ: запрос с секундой и кодом сцены скопируется для чата">Для ИИ</button>
      <button data-toast="Сохранить: ролик запишется файлом к вам на компьютер">Сохранить</button>
      <a href="Видео.html">Вернуться на сайт</a>
    </div>
  </div>
  <div class="ex ex-apple" data-lines='[["Плагины", "для Pixso."], ["Слайды", "в PowerPoint."], ["Градиенты", "в один клик."], ["Таблицы", "без рутины."]]'><i class="ex-bar"></i></div>
  <div class="tl"><i>Плагины · 1,2&nbsp;с</i><i>Слайды · 1,2&nbsp;с</i><i>Градиенты · 1,2&nbsp;с</i><i>Таблицы · 1,2&nbsp;с</i><span class="head"></span></div>
  <p class="ws-note">Так откроется плеер с&nbsp;вашим роликом. Это макет, на сайте будет нынешний плеер</p>
</div>
